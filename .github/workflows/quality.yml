name: Repository quality
on:
  pull_request:
  push:
    branches: ["master"]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install --requirement requirements-docs.txt
      - run: python -m compileall -q scripts
      - run: python scripts/verify_repository.py
      - run: node --check docs/assets/javascripts/app.js
      - run: mkdocs build --strict --site-dir site
